pre-commit:
  commands:
    vp-check:
      glob: "{src,worker}/**/*.{js,ts,jsx,tsx}"
      run: npx vp check --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true

    typecheck:
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit

pre-push:
  commands:
    vp-check:
      glob: "{src,worker}/**/*.{js,ts,jsx,tsx}"
      run: npx vp check --no-error-on-unmatched-pattern {push_files}

    typecheck:
      run: npx tsc --noEmit

    security-audit:
      run: npm audit --audit-level moderate
